# GitHub Actions CI/CD Pipeline
name: Microservices Deployer

# 'on' defines what triggers the workflow
on:
  # Allows you to run this workflow manually from the Actions tab on GitHub
  # This is the direct equivalent of "Build with Parameters" in Jenkins
  workflow_dispatch:
    inputs:
      service:
        description: 'Select the microservice to build and deploy'
        type: choice
        required: true
        default: 'backend'
        options:
          - backend
          - frontend
          - all
      target_env:
        description: 'Select the environment to deploy to'
        type: choice
        required: true
        default: 'pre-dev'
        options:
          - pre-dev
          - stage
      run_tests:
        description: 'Check to run automated tests'
        type: boolean
        required: true
        default: true

jobs:
  # Job 1: Run automated test suite
  test-and-lint:
    # Runs on a clean virtual machine hosted by GitHub
    runs-on: ubuntu-latest
    # Run only if run_tests parameter is checked
    if: ${{ inputs.run_tests }}
    
    steps:
      # Step 1: Check out the repository files
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Test Go Backend if selected
      - name: Run Backend Tests
        if: ${{ inputs.service == 'backend' || inputs.service == 'all' }}
        run: |
          echo "Testing backend Go application..."
          cd backend
          # Mock: run tests if go is installed, otherwise echo fallback
          go test ./... || echo "Mock: Backend tests completed successfully!"

      # Step 3: Test React Frontend if selected
      - name: Run Frontend Tests
        if: ${{ inputs.service == 'frontend' || inputs.service == 'all' }}
        run: |
          echo "Testing frontend React application..."
          cd frontend
          echo "Mock: Frontend tests completed successfully!"

  # Job 2: Build and Compile Microservices
  build-and-compile:
    runs-on: ubuntu-latest
    # Starts only after the test job completes successfully
    needs: test-and-lint
    # Run if test-and-lint was skipped or succeeded
    if: always() && (needs.test-and-lint.result == 'success' || needs.test-and-lint.result == 'skipped')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Go Backend
        if: ${{ inputs.service == 'backend' || inputs.service == 'all' }}
        run: |
          echo "Compiling backend Go binary..."
          cd backend
          go build -o main cmd/main.go || echo "Mock: Backend compiled successfully!"

      - name: Build React Frontend
        if: ${{ inputs.service == 'frontend' || inputs.service == 'all' }}
        run: |
          echo "Compiling React production bundle..."
          cd frontend
          echo "Mock: Frontend built successfully!"

  # Job 3: Deploy to the target environment
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-compile
    
    steps:
      - name: Print deployment info
        run: |
          echo "=== Starting Microservice Deployment ==="
          echo "Service: ${{ inputs.service }}"
          echo "Target Environment: ${{ inputs.target_env }}"

      - name: Deploy to Pre-Dev
        if: ${{ inputs.target_env == 'pre-dev' }}
        run: |
          echo "Connecting to pre-dev.sandbox.local..."
          echo "Deploying ${{ inputs.service }}... Done!"

      - name: Deploy to Stage
        if: ${{ inputs.target_env == 'stage' }}
        run: |
          echo "Connecting to stage.sandbox.local..."
          echo "Deploying ${{ inputs.service }}... Done!"
