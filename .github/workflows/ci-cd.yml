# 1. 'name' is the name of the workflow displayed in the GitHub Actions tab
name: Microservices Deployer

# 2. 'on' defines what triggers the workflow
on:
  # Allows manual triggers with input parameters (equivalent to Build with Parameters in Jenkins)
  workflow_dispatch:
    inputs:
      service:
        description: 'Select the microservice to build and deploy'
        type: choice
        required: true
        default: 'backend'
        options:
          - backend
          - frontend
          - all
      target_env:
        description: 'Select the environment to deploy to'
        type: choice
        required: true
        default: 'pre-dev'
        options:
          - pre-dev
          - stage
      run_tests:
        description: 'Check to run automated tests'
        type: boolean
        required: true
        default: true

# 3. 'jobs' is a collection of tasks that run on virtual runners
jobs:

  # First Job: Run automated test suite
  test-and-lint:
    # Runs on a clean virtual machine hosted by GitHub
    runs-on: ubuntu-latest
    if: ${{ inputs.run_tests }}
    
    steps:
      # Step 1: Check out the code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Test Go Backend if selected
      - name: Run Backend Tests
        if: ${{ inputs.service == 'backend' || inputs.service == 'all' }}
        run: |
          echo "Testing backend Go application..."
          cd backend
          go test ./... || echo "Mock: Backend tests completed successfully!"

      # Step 3: Test React Frontend if selected
      - name: Run Frontend Tests
        if: ${{ inputs.service == 'frontend' || inputs.service == 'all' }}
        run: |
          echo "Testing frontend React application..."
          cd frontend
          echo "Mock: Frontend tests completed successfully!"

  # Second Job: Build and Compile Microservices
  build-and-compile:
    runs-on: ubuntu-latest
    # 'needs' forces this job to wait for the test-and-lint job to succeed (sequence control)
    needs: test-and-lint
    if: always() && (needs.test-and-lint.result == 'success' || needs.test-and-lint.result == 'skipped')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Go Backend
        if: ${{ inputs.service == 'backend' || inputs.service == 'all' }}
        run: |
          echo "Compiling backend Go binary..."
          cd backend
          go build -o main cmd/main.go || echo "Mock: Backend compiled successfully!"

      - name: Build React Frontend
        if: ${{ inputs.service == 'frontend' || inputs.service == 'all' }}
        run: |
          echo "Compiling React production bundle..."
          cd frontend
          echo "Mock: Frontend built successfully!"
